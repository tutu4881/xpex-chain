syntax = "proto3";

package example.dex;

import "gogoproto/gogo.proto";

option go_package = "github.com/cosmos/example/x/dex/types";

message Pool {
  uint64 id = 1;
  string token_a = 2;
  string token_b = 3;
  string reserve_a = 4;
  string reserve_b = 5;
  string total_lp = 6;
  string fee_bps = 7;
}
